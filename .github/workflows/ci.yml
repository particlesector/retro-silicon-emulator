name: CI
on:
  pull_request:
    branches: [main]
jobs:
  core:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build g++
      - name: Configure
        run: cmake --preset dev -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
      - name: Build
        run: cmake --build --preset dev
      - name: Test
        run: ctest --preset dev
  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build g++
      - name: Configure
        run: >-
          cmake -S . -B build/sanitizers -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build/sanitizers
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build/sanitizers --output-on-failure
  desktop-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: libsdl-org/SDL
          ref: 147a8ee32dbf9ac02f3794964490687b6bbda1bc # SDL 3.4.14
          path: build/sdl-source
      - name: Install desktop tools
        run: >-
          sudo apt-get update && sudo apt-get install -y ninja-build g++
          libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev
          libxss-dev libxtst-dev libasound2-dev libvulkan-dev mesa-vulkan-drivers
          xvfb xauth
      - name: Build SDL3
        run: |
          cmake -S build/sdl-source -B build/sdl-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PWD/build/sdl-install" -DSDL_TESTS=OFF -DSDL_STATIC=OFF -DSDL_X11=ON -DSDL_VULKAN=ON
          cmake --build build/sdl-build --parallel 2
          cmake --install build/sdl-build
      - name: Build and package Release desktop
        run: |
          cmake -S . -B build/desktop -G Ninja -DCMAKE_BUILD_TYPE=Release -DRSE_BUILD_DESKTOP=ON -DCMAKE_PREFIX_PATH="$PWD/build/sdl-install" -DRSE_SDL_LICENSE="$PWD/build/sdl-source/LICENSE.txt"
          cmake --build build/desktop --parallel 2
          ctest --test-dir build/desktop --output-on-failure
          cmake --build build/desktop --target package
          mkdir build/package-smoke
          unzip build/desktop/retro-silicon-emulator-*.zip -d build/package-smoke
      - name: Verify extracted Vulkan desktop package
        env:
          SDL_AUDIO_DRIVER: dummy
          SDL_VIDEO_DRIVER: x11
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
        run: |
          build/desktop/rse-desktop-policy-tests --write-smoke build/desktop/desktop-smoke.nes
          app=$(find "$PWD/build/package-smoke" -name rse-desktop -type f)
          test -n "$app"
          xvfb-run -a "$app" --smoke "$PWD/build/desktop/desktop-smoke.nes" --seconds 30
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-release
          path: build/desktop/retro-silicon-emulator-*.zip
